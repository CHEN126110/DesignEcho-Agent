version: 2
updates:
  - package-ecosystem: npm
    directory: /DesignEcho-Agent
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /DesignEcho-UXP
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
